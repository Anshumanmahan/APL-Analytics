<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>APL Analytics</title>
<meta name="description" content="Archery Premier League Season 2 analytics: points table, teams, players, matches and the numbers behind every arrow.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-1 -1 2 2'%3E%3Ccircle r='1' fill='%233b8fd9'/%3E%3Ccircle r='.7' fill='%23e5484d'/%3E%3Ccircle r='.4' fill='%23f5c518'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<script>
/* pick the theme before the page paints: the visitor's last choice, else their device setting */
(function () { var t; try { t = localStorage.getItem('apl-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/analytics.css">
</head>
<body><div id="root"></div><script type="module" src="/js/main.js"></script></body>
