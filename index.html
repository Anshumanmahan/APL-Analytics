(function () { var t; try { t = localStorage.getItem('apl-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';

</script>

<script>
/* the loader: hidden until start() (after the passcode, or at once when none is needed). Steps fill while the
   season loads; main.js then calls done(stats), or hide() when the passcode was wrong. */
(function () {
  var root = document.documentElement, el = document.getElementById('ldr'), step = document.getElementById('ld-step');
  var slots = el.querySelectorAll('.ld-ring'), fill = el.querySelector('.ld-fill'), calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STEPS = ['Opening the scorebook', 'Reading every match', 'Counting the arrows', 'Ranking the archers'];
  var MIN = calm ? 300 : 2300, t0 = 0, at = 0, timer, waits = [];
  function show(i) { at = i; fill.style.width = Math.min(100, i * 25 + (i < 4 ? 13 : 0)) + '%'; for (var k = 0; k < slots.length; k++) slots[k].classList.toggle('on', k < i); if (STEPS[i]) step.textContent = STEPS[i]; }
  function later(f, ms) { waits.push(setTimeout(f, ms)); }
  function stop() { clearInterval(timer); waits.forEach(clearTimeout); waits = []; }
  function count(node, n, ms) { var s = Date.now(); (function f() { var p = Math.min(1, (Date.now() - s) / ms); node.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))).toLocaleString('en-IN'); if (p < 1) requestAnimationFrame(f); })(); }
  function leave() { root.classList.add('ld-reveal'); el.classList.add('out'); root.classList.remove('ld-on'); setTimeout(function () { el.remove(); root.classList.remove('ld-reveal'); }, 1100); }
  window.APL_LOADER = {
    start: function (keep) { if (keep && !el.classList.contains('idle')) return; stop(); t0 = Date.now(); show(0); el.classList.remove('idle'); root.classList.add('ld-on');
      // walk through the first three steps while waiting; the last finishes only when the data is in
      timer = setInterval(function () { if (at < 2) show(at + 1); }, 700); },
    hide: function () { stop(); el.classList.add('idle'); root.classList.remove('ld-on'); },
    done: function (st) {
      later(function () { clearInterval(timer); show(3);
        later(function () { show(4);
          if (st && st.arrows) { step.innerHTML = '<b class="ld-count">0</b> arrows · <b class="ld-count">0</b> matches';
            var c = step.querySelectorAll('.ld-count'); count(c[0], st.arrows, calm ? 1 : 700); count(c[1], st.matches || 0, calm ? 1 : 700); }
          later(leave, calm ? 200 : 1000); }, calm ? 0 : 350); }, Math.max(0, MIN - (Date.now() - t0))); }
  };
})();
</script>
<div id="root"></div><script type="module" src="/js/main.js"></script></body>
