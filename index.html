<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06080c">
<title>APL Analytics</title>
<meta name="description" content="The only stats platform for the Archery Premier League. Season 2 analytics: points table, teams, players, matches and the numbers behind every arrow.">
<link rel="icon" type="image/svg+xml" href="/logo.svg"><link rel="apple-touch-icon" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet">
<script>
/* pick the theme before the page paints: the visitor's last choice, else their device setting */
(function () { var t; try { t = localStorage.getItem('apl-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/analytics.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body><div id="root"></div><script type="module" src="/js/main.js"></script></body>
</html>
